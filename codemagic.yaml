workflows:
  kmp-ios-build:
    name: Build Katoba iOS (Unsigned IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      java: 17
    scripts:
      - name: Set executable permissions
        script: |
          chmod +x gradlew
      - name: Build KMP iOS Framework
        script: |
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64
      - name: Prepare Compose Resources for iOS
        script: |
          ./gradlew :composeApp:iosArm64AggregateResources
          echo "=== Compose Resources prepared ==="
          find composeApp/build -type d -name "compose-resources" 2>/dev/null || true
      - name: Build unsigned iOS App via Xcodebuild
        script: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $CM_BUILD_DIR/iosApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive
      - name: Package IPA
        script: |
          mkdir -p $CM_BUILD_DIR/Payload
          APP_PATH=$(find "$CM_BUILD_DIR/iosApp.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(ls -d $CM_BUILD_DIR/iosApp.xcarchive/Products/Applications/*.app | head -n 1)
          fi
          echo "Packaging app: $APP_PATH"
          cp -r "$APP_PATH" $CM_BUILD_DIR/Payload/
          
          # Dengan isStatic = true, TIDAK perlu copy Frameworks/ apapun.
          # Semua kode Kotlin sudah ter-link langsung ke dalam binary utama.
          # Hapus folder Frameworks/ jika ada sisa dari build sebelumnya
          TARGET_APP="$CM_BUILD_DIR/Payload/$(basename "$APP_PATH")"
          rm -rf "$TARGET_APP/Frameworks"
          
          # Copy Compose Resources ke dalam app bundle.
          # Dengan isStatic = true, resource files TIDAK di-embed ke framework binary,
          # sehingga harus disalin manual ke Katoba.app/compose-resources/
          COMPOSE_RES=""
          # Path 1: output dari syncComposeResourcesForIos (jika xcodebuild menjalankannya)
          if [ -d "$TARGET_APP/compose-resources" ]; then
            echo "Compose resources already present in app bundle."
          else
            # Path 2: output dari iosArm64AggregateResources (path resmi Kotlin 2.1 / Compose 1.7)
            for CANDIDATE in \
              "composeApp/build/kotlin-multiplatform-resources/aggregated-resources/iosArm64" \
              "composeApp/build/compose/ios/composeApp/compose-resources" \
              "composeApp/build/compose/ios/compose-resources"; do
              if [ -d "$CANDIDATE" ]; then
                COMPOSE_RES="$CANDIDATE"
                break
              fi
            done
            # Path 3: cari secara generik
            if [ -z "$COMPOSE_RES" ]; then
              COMPOSE_RES=$(find composeApp/build -type d -name "aggregated-resources" | head -n 1)
              if [ -n "$COMPOSE_RES" ]; then
                COMPOSE_RES="$COMPOSE_RES/iosArm64"
              fi
            fi
            if [ -z "$COMPOSE_RES" ]; then
              COMPOSE_RES=$(find composeApp/build -type d -name "compose-resources" | head -n 1)
            fi
            
            if [ -n "$COMPOSE_RES" ] && [ -d "$COMPOSE_RES" ]; then
              echo "Copying Compose Resources from $COMPOSE_RES to $TARGET_APP/compose-resources/"
              mkdir -p "$TARGET_APP/compose-resources"
              cp -R "$COMPOSE_RES"/* "$TARGET_APP/compose-resources/"
              echo "=== Contents of compose-resources/ ==="
              find "$TARGET_APP/compose-resources" -type f | head -20
            else
              echo "WARNING: Compose resources directory not found! App may crash on resource load."
              echo "=== Searching for resource files ==="
              find composeApp/build -name "katoba.png" 2>/dev/null | head -10
            fi
          fi
          
          chmod -R 755 "$TARGET_APP"
          cd $CM_BUILD_DIR
          zip -qr katoba-ios.ipa Payload
    artifacts:
      - katoba-ios.ipa

  kmp-android-build:
    name: Build Katoba Android (Release APK)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Set executable permissions
        script: |
          chmod +x gradlew
      - name: Build Android Release APK
        script: |
          ./gradlew :composeApp:assembleRelease
    artifacts:
      - composeApp/build/outputs/apk/release/*.apk
