workflows:
  kmp-ios-build:
    name: Build Katoba iOS (Unsigned IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      java: 17
    scripts:
      - name: Set executable permissions
        script: |
          chmod +x gradlew
      - name: Build KMP iOS Framework
        script: |
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64
      - name: Prepare Compose Resources for iOS
        script: |
          ./gradlew :composeApp:iosArm64AggregateResources
          echo "=== Compose Resources prepared ==="
          find composeApp/build -type d -name "composeResources" 2>/dev/null || true
          find composeApp/build -name "katoba.png" 2>/dev/null || true
      - name: Build unsigned iOS App via Xcodebuild
        script: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $CM_BUILD_DIR/iosApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive
      - name: Package IPA
        script: |
          mkdir -p $CM_BUILD_DIR/Payload
          APP_PATH=$(find "$CM_BUILD_DIR/iosApp.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(ls -d $CM_BUILD_DIR/iosApp.xcarchive/Products/Applications/*.app | head -n 1)
          fi
          echo "Packaging app: $APP_PATH"
          cp -r "$APP_PATH" $CM_BUILD_DIR/Payload/
          
          # Dengan isStatic = true, TIDAK perlu copy Frameworks/ apapun.
          # Semua kode Kotlin sudah ter-link langsung ke dalam binary utama.
          # Hapus folder Frameworks/ jika ada sisa dari build sebelumnya
          TARGET_APP="$CM_BUILD_DIR/Payload/$(basename "$APP_PATH")"
          rm -rf "$TARGET_APP/Frameworks"
          
          # Copy Compose Resources ke dalam app bundle
          # Compose Multiplatform 1.7+ pada iOS mencari file di:
          # 1) Katoba.app/composeResources/id.kotoba.app/...
          # 2) Katoba.app/compose-resources/id.kotoba.app/...
          # 3) Katoba.app/id.kotoba.app/...
          echo "=== Searching for generated compose resources ==="
          RES_DIR=$(find composeApp/build -type d -name "composeResources" 2>/dev/null | grep -E "aggregated-resources|preparedResources|assembledResources" | head -n 1)
          
          if [ -z "$RES_DIR" ]; then
            RES_DIR=$(find composeApp/build -type d -name "composeResources" 2>/dev/null | head -n 1)
          fi
          
          if [ -n "$RES_DIR" ] && [ -d "$RES_DIR" ]; then
            echo "Found Compose Resources at: $RES_DIR"
            mkdir -p "$TARGET_APP/composeResources"
            mkdir -p "$TARGET_APP/compose-resources"
            
            # Copy ke TARGET_APP/composeResources/
            cp -R "$RES_DIR"/* "$TARGET_APP/composeResources/"
            # Copy ke TARGET_APP/compose-resources/ (legacy/alternative path)
            cp -R "$RES_DIR"/* "$TARGET_APP/compose-resources/"
            # Copy ke TARGET_APP root (direct path)
            cp -R "$RES_DIR"/* "$TARGET_APP/"
            
            echo "=== Verified Bundle Resources ==="
            find "$TARGET_APP" -name "katoba.png"
          else
            echo "WARNING: Could not find composeResources folder in build directory!"
            find composeApp/build -name "katoba.png" 2>/dev/null || true
          fi
          
          chmod -R 755 "$TARGET_APP"
          cd $CM_BUILD_DIR
          zip -qr katoba-ios.ipa Payload
    artifacts:
      - katoba-ios.ipa

  kmp-android-build:
    name: Build Katoba Android (Release APK)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Set executable permissions
        script: |
          chmod +x gradlew
      - name: Build Android Release APK
        script: |
          ./gradlew :composeApp:assembleRelease
    artifacts:
      - composeApp/build/outputs/apk/release/*.apk
