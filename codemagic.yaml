workflows:
  kmp-ios-build:
    name: Build Katoba iOS (Unsigned IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      java: 17
    scripts:
      - name: Set executable permissions
        script: |
          chmod +x gradlew
      - name: Build KMP iOS Framework
        script: |
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64
      - name: Build unsigned iOS App via Xcodebuild
        script: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $CM_BUILD_DIR/iosApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive
      - name: Package IPA with Embedded Frameworks
        script: |
          mkdir -p $CM_BUILD_DIR/Payload
          APP_PATH=$(find "$CM_BUILD_DIR/iosApp.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(ls -d $CM_BUILD_DIR/iosApp.xcarchive/Products/Applications/*.app | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" $CM_BUILD_DIR/Payload/
          
          TARGET_APP="$CM_BUILD_DIR/Payload/$(basename "$APP_PATH")"
          mkdir -p "$TARGET_APP/Frameworks"
          
          # Salin framework ComposeApp ke dalam bundle Frameworks agar dyld dapat menemukannya
          FRAMEWORK_SRC="composeApp/build/bin/iosArm64/releaseFramework/ComposeApp.framework"
          if [ ! -d "$FRAMEWORK_SRC" ]; then
            FRAMEWORK_SRC="composeApp/build/xcode-frameworks/Release/iphoneos/ComposeApp.framework"
          fi
          
          if [ -d "$FRAMEWORK_SRC" ]; then
            echo "Copying ComposeApp.framework from $FRAMEWORK_SRC to $TARGET_APP/Frameworks/..."
            cp -r "$FRAMEWORK_SRC" "$TARGET_APP/Frameworks/"
          else
            echo "WARNING: ComposeApp.framework not found in standard build directories!"
          fi
          
          chmod -R 755 "$TARGET_APP"
          cd $CM_BUILD_DIR
          zip -qr katoba-ios.ipa Payload
    artifacts:
      - katoba-ios.ipa

  kmp-android-build:
    name: Build Katoba Android (Release APK)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Set executable permissions
        script: |
          chmod +x gradlew
      - name: Build Android Release APK
        script: |
          ./gradlew :composeApp:assembleRelease
    artifacts:
      - composeApp/build/outputs/apk/release/*.apk
